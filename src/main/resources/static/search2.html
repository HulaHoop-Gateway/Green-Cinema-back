<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>예매 및 좌석 예약 정보</title>
</head>
<body>
<h1>🎫 예매 정보 + 💺 좌석 예약 정보</h1>

<!-- 버튼 1: 예매 정보 조회 -->
<button onclick="loadReservations()">📋 예매 정보 조회</button>

<!-- 버튼 2: 좌석 예약 정보 조회 -->
<button onclick="loadSeatReservations()">💺 좌석 예약 정보 조회</button>

<!-- 출력 영역 -->
<div id="reservationSection" style="margin-top: 30px;"></div>
<hr>
<div id="seatReservationSection" style="margin-top: 30px;"></div>

<script>
    function loadReservations() {
        fetch('http://localhost:8082/reservation/list')
            .then(res => res.json())
            .then(data => renderReservations(data))
            .catch(err => {
                console.error('예매 정보 조회 실패:', err);
                document.getElementById('reservationSection').innerHTML = '<p style="color:red;">예매 정보를 불러올 수 없습니다.</p>';
            });
    }

    function loadSeatReservations() {
        fetch('http://localhost:8082/seatReservation/list')
            .then(res => res.json())
            .then(data => renderSeatReservations(data))
            .catch(err => {
                console.error('좌석 예약 정보 조회 실패:', err);
                document.getElementById('seatReservationSection').innerHTML = '<p style="color:red;">좌석 예약 정보를 불러올 수 없습니다.</p>';
            });
    }

    function renderReservations(data) {
        const container = document.getElementById('reservationSection');
        container.innerHTML = '<h2>📋 예매 정보</h2>';

        data.forEach(r => {
            const seat = r.seatDTO || {};
            const movie = r.scheduleDTO?.movieInfo || {};
            const cinema = seat.theaterDTO?.cinemaFranchisedto || {};
            const screeningDate = r.scheduleDTO?.screeningDate || '';

            const div = document.createElement('div');
            div.style.border = '1px solid #ccc';
            div.style.padding = '10px';
            div.style.marginBottom = '10px';
            div.innerHTML = `
          <strong>예약번호:</strong> ${r.reservationNum}<br>
          <strong>회원:</strong> ${r.userDTO?.memberName || ''} (${r.userDTO?.phoneNumber || ''})<br>
          <strong>좌석:</strong> ${seat.seatRealNum} (${seat.seatType})<br>
          <strong>가격:</strong> ${seat.sale?.toLocaleString()}원<br>
          <strong>영화:</strong> ${movie.movieTitle || ''} (${movie.audienceRating || ''})<br>
          <strong>상영일시:</strong> ${screeningDate}<br>
          <strong>영화관:</strong> ${cinema.branchName || ''} / ${cinema.address || ''}<br>
          <strong>결제시간:</strong> ${r.paymentTime}<br>
          <strong>상태:</strong> ${r.state}
        `;
            container.appendChild(div);
        });
    }

    function renderSeatReservations(data) {
        const container = document.getElementById('seatReservationSection');
        container.innerHTML = '<h2>💺 좌석 예약 정보</h2>';

        data.forEach(r => {
            const seat = r.seatInfo || {};
            const div = document.createElement('div');
            div.style.border = '1px solid #aaa';
            div.style.padding = '10px';
            div.style.marginBottom = '10px';
            div.innerHTML = `
          <strong>예약ID:</strong> ${r.reservationId}<br>
          <strong>스케줄번호:</strong> ${r.scheduleNum}<br>
          <strong>좌석코드:</strong> ${r.seatCode}<br>
          <strong>좌석번호:</strong> ${seat.seatRealNum || ''} (${seat.seatType || ''})<br>
          <strong>가격:</strong> ${seat.sale?.toLocaleString() || ''}원<br>
          <strong>예약상태:</strong> ${r.reserved ? '예약됨' : '취소됨'}<br>
          <strong>예약시간:</strong> ${r.reservedAt}
        `;
            container.appendChild(div);
        });
    }
</script>
</body>
</html>
