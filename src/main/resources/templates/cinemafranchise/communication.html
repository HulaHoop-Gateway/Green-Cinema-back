<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화관 정보 전송</title>
</head>
<body>
<h2>영화관 정보 입력</h2>
<form action="/cinemafranchise/list" method="post">
    <label for="branchNum">지점 번호:</label>
    <input type="number" id="branchNum" name="branchNum" required><br><br>

    <label for="branchName">지점 이름:</label>
    <input type="text" id="branchName" name="branchName" required><br><br>

    <label for="address">주소:</label>
    <input type="text" id="address" name="address" required><br><br>

    <button type="submit">전송</button>
</form>
</body>
</html>
