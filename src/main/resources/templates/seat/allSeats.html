<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>전체 좌석 목록</title>
</head>
<body>
<h2>전체 좌석 목록</h2>

<!-- 좌석이 없을 경우 안내 메시지 -->
<p th:if="${#lists.isEmpty(seatList)}">조회된 좌석이 없습니다.</p>

<!-- 좌석이 있을 경우 테이블 출력 -->
<table th:if="${!#lists.isEmpty(seatList)}" border="1">
    <thead>
    <tr>
        <th>좌석 번호</th>
        <th>좌석 종류</th>
        <th>가격</th>
        <th>상영관 번호</th>
        <th>지점 이름</th>
        <th>영화 제목</th>
        <th>상영 일시</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="seat : ${seatList}">
        <td th:text="${seat.seatRealNum}">A1</td>
        <td th:text="${seat.seatType}">일반석</td>
        <td th:text="${seat.sale}">10000</td>
        <td th:text="${seat.theaterDTO.screeningNumber}">1관</td>
        <td th:text="${seat.theaterDTO.cinemaFranchisedto.branchName}">강남점</td>
        <td th:text="${seat.scheduleDTO.movieInfo.movieTitle}">영화제목</td>
        <td th:text="${seat.scheduleDTO.screeningDate}">2025-10-31 18:00</td>
    </tr>
    </tbody>
</table>
</body>
</html>
