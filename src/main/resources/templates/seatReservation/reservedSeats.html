<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>예약된 좌석 목록</title>
</head>
<body>
<h1>예약된 좌석 목록 (상영 일정: [[${scheduleNum}]])</h1>
<table border="1">
    <tr>
        <th>예약 ID</th>
        <th>좌석 코드</th>
        <th>예약 여부</th>
        <th>예약 시간</th>
    </tr>
    <tr th:each="seat : ${reservedSeats}">
        <td th:text="${seat.reservationId}"></td>
        <td th:text="${seat.seatCode}"></td>
        <td th:text="${seat.reserved}"></td>
        <td th:text="${seat.reservedAt}"></td>
    </tr>
</table>
</body>
</html>
